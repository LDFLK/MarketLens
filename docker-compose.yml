version: '3.8'

services:
  # DATABASE SERVICE
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file:
      - ./engineering/backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d market_lens_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BACKEND SERVICE 
  backend:
    build:
      context: ./engineering/backend
      dockerfile: Dockerfile.backend
    container_name: go_backend
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file:
      - ./engineering/backend/.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  # FRONTEND SERVICE 
  frontend:
    build:
      context: ./engineering/frontend
      dockerfile: Dockerfile.frontend
    container_name: nextjs_app
    ports:
      - "3000:3000"
    env_file:
      - ./engineering/frontend/.env
    depends_on:
      - backend
    networks:
      - app-network

  # # CRAWLER SERVICE 
  crawler:
    build:
      context: ./engineering/crawler
      dockerfile: Dockerfile.crawler
    ports:
      - "8000:8000"
    container_name: python_crawler
    env_file:
      - ./engineering/crawler/.env
    environment:
      - API_URL=http://backend:8080/api/v1/jobs
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge